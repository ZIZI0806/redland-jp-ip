<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RED LAND 2026 · 日本 IP 展位复盘</title>
<style>
:root{
  --bg:#f4f1ec;
  --panel:#ffffff;
  --ink:#16181d;
  --ink2:#454b57;
  --ink3:#7b8291;
  --line:#e2ddd4;
  --red:#c8102e;
  --a:#e8590c;
  --b:#c99700;
  --c:#1c7ed6;
  --pos:#1f9254;
  --neu:#8a8f9a;
  --neg:#d9480f;
  --shadow:0 1px 2px rgba(20,20,30,.06), 0 8px 24px rgba(20,20,30,.08);
  --shadow-lg:0 2px 6px rgba(20,20,30,.08), 0 24px 60px rgba(20,20,30,.18);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

/* ============ 地图舞台 ============ */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
/* --sc 由 JS 同步为当前缩放值：热区的描边、标签、圆角都除以它，
   这样地图缩放时「位置和面积跟着缩，但视觉粗细保持屏幕像素恒定」 */
#world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;--sc:1}
#mapimg{display:block;width:3952px;height:2879px;user-select:none;-webkit-user-drag:none;pointer-events:none}

/* 展位热区：内圈用区域色，外圈白色描边——保证在蓝/黄底色上也能跳出来 */
.spot{
  position:absolute;cursor:pointer;
  border-radius:calc(12px / var(--sc));
  background:var(--fill);
  box-shadow:
    inset 0 0 0 calc(2px / var(--sc)) var(--line),
    0 0 0 calc(2px / var(--sc)) rgba(255,255,255,.92);
  transition:background .15s ease, box-shadow .15s ease,
             transform .18s cubic-bezier(.22,1,.36,1);
  transform-origin:center center;
  z-index:1;
}
.spot[data-zone="A"]{--fill:rgba(232,89,12,.22); --line:rgba(214,74,6,.95)}
.spot[data-zone="B"]{--fill:rgba(201,151,0,.24); --line:rgba(176,128,0,.95)}
.spot[data-zone="C"]{--fill:rgba(28,126,214,.22); --line:rgba(17,104,180,.95)}

.spot:hover,.spot.on{
  --fill:rgba(200,16,46,.36);
  box-shadow:
    inset 0 0 0 calc(3px / var(--sc)) #c8102e,
    0 0 0 calc(2px / var(--sc)) #fff,
    0 0 calc(26px / var(--sc)) rgba(200,16,46,.6);
  transform:scale(1.07);
  z-index:5;
}
.spot.on{transform:scale(1.03)}

/* 悬停标签：同样按 1/sc 反向缩放，保持屏幕字号恒定 */
.spot::after{
  content:attr(data-label);
  position:absolute;left:50%;bottom:calc(100% + 9px / var(--sc));
  /* translateX(-50%) 把标签自身居中到热区中轴；scale(1/sc) 抵消地图缩放，
     使字号/内边距在屏幕上恒定 */
  transform:translateX(-50%) scale(calc(1 / var(--sc)));
  transform-origin:center bottom;
  white-space:nowrap;font-size:12.5px;font-weight:600;line-height:1;
  padding:6px 10px;border-radius:999px;color:#fff;background:var(--ink);
  opacity:0;transition:opacity .15s;pointer-events:none;
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.spot:hover::after,.spot.on::after{opacity:1}

.spot.dim{opacity:.16;pointer-events:none}
.spot.dim:hover{transform:none}

/* 入场提示：16 个热区依次闪一次，告诉用户「这里可以点」 */
.spot.hint{animation:spotHint 1.5s ease-out both}
@keyframes spotHint{
  0%  {box-shadow:inset 0 0 0 calc(2px / var(--sc)) var(--line),
                  0 0 0 calc(2px / var(--sc)) rgba(255,255,255,.92),
                  0 0 0 0 rgba(200,16,46,.55)}
  55% {box-shadow:inset 0 0 0 calc(3px / var(--sc)) var(--line),
                  0 0 0 calc(2px / var(--sc)) rgba(255,255,255,.92),
                  0 0 calc(30px / var(--sc)) calc(6px / var(--sc)) rgba(200,16,46,.5)}
  100%{box-shadow:inset 0 0 0 calc(2px / var(--sc)) var(--line),
                  0 0 0 calc(2px / var(--sc)) rgba(255,255,255,.92),
                  0 0 calc(30px / var(--sc)) calc(14px / var(--sc)) rgba(200,16,46,0)}
}

/* ============ 悬浮 UI ============ */
.card{
  position:fixed;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);z-index:20;
}
#title{top:18px;left:18px;padding:16px 20px;max-width:min(430px,calc(100vw - 36px))}
#title h1{margin:0;font-size:19px;letter-spacing:-.2px;line-height:1.3}
#title h1 small{display:block;font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:5px}
#title .row{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
#title .stat{font-size:12px;color:var(--ink3)}
#title .stat b{display:block;font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.4px}

#tools{top:18px;right:18px;padding:12px;display:flex;flex-direction:column;gap:10px;width:236px}
#q{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
  font-size:13px;font-family:inherit;background:#fbfaf8;color:var(--ink);outline:none;
}
#q:focus{border-color:var(--ink3);background:#fff}
.zoomrow{display:flex;gap:6px}
.zoomrow button{
  flex:1;border:1px solid var(--line);background:#fbfaf8;border-radius:9px;
  padding:7px 0;font-size:13px;font-family:inherit;cursor:pointer;color:var(--ink2);
}
.zoomrow button:hover{background:#fff;border-color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fbfaf8;border-radius:999px;
  padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink2);font-family:inherit;
  transition:.15s;
}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[data-z="A"][aria-pressed="true"]{background:var(--a);border-color:var(--a)}
.chip[data-z="B"][aria-pressed="true"]{background:var(--b);border-color:var(--b)}
.chip[data-z="C"][aria-pressed="true"]{background:var(--c);border-color:var(--c)}

#list{bottom:18px;right:18px;width:236px;max-height:44vh;overflow:auto;padding:8px}
#list .it{
  display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;
  cursor:pointer;font-size:13px;line-height:1.3;
}
#list .it:hover{background:#f4f1ec}
#list .it.on{background:#fdecef}
#list .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
#list .dot[data-z="A"]{background:var(--a)}
#list .dot[data-z="B"]{background:var(--b)}
#list .dot[data-z="C"]{background:var(--c)}
#list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .no{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}

#hint{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;
  font-size:12px;color:var(--ink3);
  background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;
}

/* ============ 详情页 ============ */
#veil{
  position:fixed;inset:0;background:rgba(22,24,29,.5);backdrop-filter:blur(3px);
  z-index:40;opacity:0;pointer-events:none;transition:opacity .22s;
}
#veil.on{opacity:1;pointer-events:auto}
#detail{
  position:fixed;z-index:50;left:50%;top:50%;width:min(1000px,calc(100vw - 48px));
  height:min(760px,calc(100vh - 48px));margin:0;
  background:var(--panel);border-radius:20px;box-shadow:var(--shadow-lg);
  display:none;flex-direction:column;overflow:hidden;
  transform-origin:0 0;transform:translate(-50%,-50%);
}
#detail.on{display:flex}
#detail.anim{transition:transform .34s cubic-bezier(.22,1,.36,1), opacity .2s}

.dhead{
  padding:20px 26px 16px;border-bottom:1px solid var(--line);flex:0 0 auto;
  display:flex;align-items:flex-start;gap:16px;
}
.dhead .badge{
  flex:0 0 auto;font-size:13px;font-weight:700;color:#fff;border-radius:9px;
  padding:7px 11px;letter-spacing:.3px;font-variant-numeric:tabular-nums;
}
.dhead .badge[data-z="A"]{background:var(--a)}
.dhead .badge[data-z="B"]{background:var(--b)}
.dhead .badge[data-z="C"]{background:var(--c)}
.dhead .ttl{flex:1;min-width:0}
.dhead h2{margin:0;font-size:22px;letter-spacing:-.3px;line-height:1.25}
.dhead .sub{margin-top:5px;font-size:13px;color:var(--ink3)}
#xbtn{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
  background:#fbfaf8;cursor:pointer;font-size:17px;line-height:1;color:var(--ink2);
}
#xbtn:hover{background:#f0ece6}

.dbody{flex:1;overflow:auto;padding:22px 26px 34px}
.sec{margin-bottom:28px}

/* 详情页头部：用户实拍图廊 */
.gallery{margin:0 0 26px}
.gallery .gtop{
  display:flex;align-items:baseline;gap:9px;margin-bottom:11px;
}
.gallery .gtop h3{
  margin:0;font-size:13px;font-weight:700;color:var(--ink3);letter-spacing:.8px;
}
.gallery .gtop .gcount{font-size:11.5px;color:var(--ink3)}
.gallery .gstrip{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  gap:10px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:thin;
}
.gallery .gitem{
  position:relative;border-radius:11px;overflow:hidden;background:#eceae5;
  aspect-ratio:3/4;cursor:zoom-in;border:1px solid var(--line);
}
.gallery .gitem img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .35s cubic-bezier(.22,1,.36,1)}
.gallery .gitem:hover img{transform:scale(1.06)}
.gallery .gitem .gcap{
  position:absolute;left:0;right:0;bottom:0;padding:16px 9px 7px;
  font-size:11px;line-height:1.4;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.78));
  opacity:0;transition:opacity .2s;
}
.gallery .gitem:hover .gcap{opacity:1}
.gallery .gnote{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.6}
.gallery .gempty{
  border:1px dashed var(--line);border-radius:var(--r);padding:18px;
  text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.7;background:#fbfaf8;
}

/* 图片灯箱 */
#lbox{
  position:fixed;inset:0;z-index:70;background:rgba(14,15,18,.92);
  display:none;align-items:center;justify-content:center;padding:40px;
}
#lbox.on{display:flex}
#lbox img{max-width:100%;max-height:calc(100vh - 130px);border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lbox .lcap{
  position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  color:#e8e6e2;font-size:12.5px;text-align:center;max-width:min(760px,86vw);line-height:1.6;
}
#lbox .lcap a{color:#9fc6ff}
#lbox .lx{
  position:absolute;top:20px;right:24px;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);
  color:#fff;font-size:18px;cursor:pointer;line-height:1;
}
#lbox .lx:hover{background:rgba(255,255,255,.18)}
.sec > h3{
  margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink3);
  letter-spacing:.8px;display:flex;align-items:center;gap:9px;
}
.sec > h3::after{content:"";flex:1;height:1px;background:var(--line)}

.kv{display:grid;grid-template-columns:88px 1fr;gap:10px 14px;font-size:14px;line-height:1.6}
.kv dt{color:var(--ink3);font-size:13px}
.kv dd{margin:0}
.kv dd b{font-weight:600}
.note{font-size:12px;color:var(--ink3);margin-top:7px;line-height:1.6}
.note b{font-weight:600}

/* 现场可领：名称 + 领取方式 */
.rwd{margin-top:12px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.rwd > b{display:block;font-size:12px;color:var(--ink3);font-weight:700;letter-spacing:.4px;margin-bottom:7px}
.rwd ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rwd li{border-left:2px solid var(--line);padding-left:10px}
.rwd .rn{display:block;font-weight:600;color:var(--ink);font-size:13px}
.rwd .rh{display:block;color:var(--ink3);font-size:11.5px;line-height:1.55;margin-top:1px}

/* 活动卡 */
.acts{display:grid;gap:16px}
.act{
  display:grid;grid-template-columns:200px 1fr;gap:16px;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fbfaf8;
}
.act .ph{background:#eceae5;min-height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.act .ph img{width:100%;height:100%;object-fit:cover;display:block}
.act .ph .ph-empty{font-size:12px;color:var(--ink3)}
.act .tx{padding:14px 16px 16px 0}
.act h4{margin:0 0 6px;font-size:15px;line-height:1.35}
.act p{margin:0;font-size:13px;line-height:1.65;color:var(--ink2)}
.act .cap{margin-top:9px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.act .cap b{font-weight:600}

/* 评价 */
/* 用户体验总结：一行只放人气排名 + 用户评论数，下面按主题给舆情 */
.rmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.rmeta .rankchip{margin:0}
.cstat{
  display:inline-flex;align-items:baseline;gap:5px;
  font-size:12.5px;color:var(--ink3);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:#fbfaf8;
}
.cstat b{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sub{margin-bottom:16px}
.sub > h4{
  font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--ink3);margin:0 0 9px;
}
.sub > p{font-size:14px;line-height:1.75;margin:0;color:var(--ink2)}
.points{display:grid;gap:9px;margin-bottom:0}
.pt{display:flex;gap:10px;font-size:13.5px;line-height:1.6;align-items:flex-start}
.tag{
  flex:0 0 auto;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;
  margin-top:1px;letter-spacing:.3px;
}
.tag.pos{background:#e6f4ec;color:var(--pos)}
.tag.neu{background:#f0f0f2;color:var(--neu)}
.tag.neg{background:#fdece8;color:var(--neg)}
.quotes{display:grid;gap:11px}
.quote{
  border-left:3px solid var(--line);padding:3px 0 3px 13px;font-size:13.5px;line-height:1.65;
}
.quote .meta{font-size:11.5px;color:var(--ink3);margin-top:5px}
.quote .meta a{color:var(--ink3)}
.empty{
  border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;
  font-size:13px;color:var(--ink3);line-height:1.7;background:#fbfaf8;
}

/* ============ 人气榜 ============ */
#heat{position:fixed;left:18px;bottom:18px;width:236px;max-height:38vh;overflow:auto;
  padding:12px 14px 14px}
#heat h4{margin:0 0 3px;font-size:12.5px;letter-spacing:.6px;color:var(--ink2)}
#heat .hsub{font-size:11px;color:var(--ink3);margin-bottom:9px;line-height:1.55}
#heat .hrow{
  display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:9px;cursor:pointer;
  transition:background .13s ease;
}
#heat .hrow:hover{background:#f2efe9}
#heat .hr{width:17px;text-align:right;font-size:11.5px;font-weight:700;color:var(--ink3);
  font-variant-numeric:tabular-nums}
#heat .hrow:nth-child(1) .hr{color:var(--red)}
#heat .hn{width:96px;flex:0 0 auto;font-size:12.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
#heat .htrack{flex:1;height:7px;border-radius:4px;background:#eceae5;overflow:hidden}
#heat .hfill{height:100%;border-radius:4px;background:var(--ink);transition:width .5s cubic-bezier(.22,1,.36,1)}
#heat .hrow[data-z="A"] .hfill{background:var(--a)}
#heat .hrow[data-z="B"] .hfill{background:var(--b)}
#heat .hrow[data-z="C"] .hfill{background:var(--c)}
#heat .hv{width:34px;text-align:right;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
#heat .hempty{font-size:12px;color:var(--ink3);line-height:1.7}

/* 详情页里的人气名次 */
.rankchip{
  display:inline-flex;align-items:center;gap:5px;margin:0 0 14px;
  font-size:12px;font-weight:600;color:#fff;background:var(--ink);
  padding:5px 11px;border-radius:999px;
}
.rankchip.top3{background:var(--red)}

.srcs{display:grid;gap:7px;font-size:13px}
.srcs a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.srcs a:hover{color:var(--red);border-color:var(--red)}
.srcs .d{color:var(--ink3);font-size:11.5px;margin-left:6px}

@media (max-width:900px){
  #list{display:none}
  #heat{display:none}
  #tools{width:auto;left:18px;right:18px;top:auto;bottom:18px}
  #hint{display:none}
  #title{right:18px}
  .act{grid-template-columns:1fr}
  .act .tx{padding:0 16px 16px}
  .act .ph{min-height:170px}
  #detail{width:calc(100vw - 20px);height:calc(100vh - 20px);border-radius:16px}
  .dbody{padding:18px}
  .dhead{padding:16px 18px 14px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <img id="mapimg" src="地图/redland-官方园区图.jpg" alt="RED LAND 2026 官方园区平面图">
  </div>
</div>

<div class="card" id="title">
  <h1>RED LAND 2026 · 日本 IP 展位复盘
    <small>上海杨浦 · 复兴岛 ｜ 2026.10.02–10.06 ｜ 点击地图上的展位看详情</small>
  </h1>
  <div class="row">
    <div class="stat"><b id="s-booth">–</b>日本 IP 展位</div>
    <div class="stat"><b id="s-zone">–</b>个区域</div>
    <div class="stat"><b id="s-note">–</b>官方笔记</div>
    <div class="stat"><b id="s-rev">–</b>已整理评价</div>
  </div>
</div>

<div class="card" id="tools">
  <input id="q" type="search" placeholder="搜 IP 名 / 展位号…" autocomplete="off">
  <div class="chips" id="zchips">
    <button class="chip" data-z="all" aria-pressed="true">全部</button>
    <button class="chip" data-z="A" aria-pressed="false">A 翻身时空港</button>
    <button class="chip" data-z="B" aria-pressed="false">B 黄金海岸线</button>
    <button class="chip" data-z="C" aria-pressed="false">C 重生试炼场</button>
  </div>
  <div class="zoomrow">
    <button id="zo">－</button><button id="zr">复位</button><button id="zi">＋</button>
  </div>
</div>

<div class="card" id="list"></div>

<div class="card" id="heat">
  <h4>人气榜</h4>
  <div class="hsub" id="heat-sub">按小红书讨论量统计</div>
  <div id="heat-rows"></div>
</div>

<div id="hint">拖拽平移 · 滚轮缩放 · 点击展位展开详情</div>

<div id="veil"></div>
<div id="detail" role="dialog" aria-modal="true">
  <div class="dhead">
    <div class="badge" id="d-badge">A25</div>
    <div class="ttl">
      <h2 id="d-title">–</h2>
      <div class="sub" id="d-sub">–</div>
    </div>
    <button id="xbtn" aria-label="关闭">✕</button>
  </div>
  <div class="dbody" id="d-body"></div>
</div>

<div id="lbox">
  <button class="lx" id="lbox-x" aria-label="关闭">✕</button>
  <img id="lbox-img" alt="">
  <div class="lcap" id="lbox-cap"></div>
</div>

<script src="data.js"></script>
<script>
const D = window.RL_DATA || {booths:[], meta:{}};
const zoneName = {A:'翻身时空港', B:'黄金海岸线', C:'重生试炼场'};
const zoneColor = {A:'#e8590c', B:'#c99700', C:'#1c7ed6'};

/* ---------- 舞台平移缩放 ---------- */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
let tx = 0, ty = 0, sc = 0.3, minSc = 0.12, maxSc = 1.6;

function apply(){
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
  // 同步缩放系数：热区的描边/标签按 1/sc 反向缩放，保持屏幕尺寸恒定
  world.style.setProperty('--sc', sc);
}
function fit(){
  const W = 3952, H = 2879;
  const k = Math.min(stage.clientWidth / W, stage.clientHeight / H) * 0.98;
  sc = k;
  tx = (stage.clientWidth - W * k) / 2;
  ty = (stage.clientHeight - H * k) / 2;
  apply();
}
/* 平滑移动到某个热区：把它放到视野中央并放大到可读比例 */
function focusSpot(el, targetSc){
  const W = 3952, H = 2879;
  const cx = (parseFloat(el.style.left) + parseFloat(el.style.width) / 2) / 100 * W;
  const cy = (parseFloat(el.style.top) + parseFloat(el.style.height) / 2) / 100 * H;
  const ns = Math.max(minSc, Math.min(maxSc, targetSc || Math.max(sc, 0.62)));
  const sx = stage.clientWidth / 2 - cx * ns;
  const sy = stage.clientHeight / 2 - cy * ns;
  world.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1)';
  tx = sx; ty = sy; sc = ns;
  apply();
  setTimeout(()=>{ world.style.transition = ''; }, 520);
}
function zoomAt(cx, cy, factor){
  const ns = Math.max(minSc, Math.min(maxSc, sc * factor));
  const r = ns / sc;
  tx = cx - (cx - tx) * r;
  ty = cy - (cy - ty) * r;
  sc = ns; apply();
}
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

let drag = null;
stage.addEventListener('pointerdown', e=>{
  if (e.target.closest('.spot')) return;
  world.style.transition = '';   // 打断 focusSpot 的过渡，避免拖拽跟手延迟
  drag = {x:e.clientX, y:e.clientY, tx, ty};
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e=>{
  if (!drag) return;
  tx = drag.tx + (e.clientX - drag.x);
  ty = drag.ty + (e.clientY - drag.y);
  apply();
});
function endDrag(){ drag = null; stage.classList.remove('dragging'); }
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

document.getElementById('zi').onclick = ()=> zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.3);
document.getElementById('zo').onclick = ()=> zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.3);
document.getElementById('zr').onclick = fit;

/* ---------- 生成热区 ---------- */
const spots = [];
D.booths.forEach((b, idx)=>{
  if (!b.spot) return;
  const [x,y,w,h] = b.spot;
  const el = document.createElement('div');
  el.className = 'spot';
  el.dataset.zone = b.zone;
  el.dataset.id = b.id;
  el.dataset.label = b.ip + ' · ' + b.no;
  el.style.left = (x*100) + '%';
  el.style.top  = (y*100) + '%';
  el.style.width  = (w*100) + '%';
  el.style.height = (h*100) + '%';
  el.title = b.ip + '（' + b.no + '）';
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${b.ip}，展位 ${b.no}，查看详情`);
  el.addEventListener('click', ev=>{ ev.stopPropagation(); openDetail(b, el); });
  el.addEventListener('keydown', ev=>{
    if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); openDetail(b, el); }
  });
  world.appendChild(el);
  spots.push({b, el});
});

/* 入场提示：热区依次亮一下，提示「这些可以点」 */
window.addEventListener('load', ()=>{
  spots.forEach(({el}, i)=>{
    setTimeout(()=>{
      el.classList.add('hint');
      setTimeout(()=> el.classList.remove('hint'), 1600);
    }, 380 + i * 90);
  });
});

/* ---------- 列表 ---------- */
const list = document.getElementById('list');
function renderList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const z = document.querySelector('#zchips .chip[aria-pressed="true"]').dataset.z;
  list.innerHTML = '';
  spots.forEach(({b, el})=>{
    const hit = (z==='all' || b.zone===z) &&
      (!q || (b.ip + b.no + b.id + b.exhibitor).toLowerCase().includes(q));
    el.classList.toggle('dim', !hit);
    if (!hit) return;
    const it = document.createElement('div');
    it.className = 'it' + (el.classList.contains('on') ? ' on' : '');
    it.innerHTML = `<span class="dot" data-z="${b.zone}"></span>
      <span class="nm">${b.ip}</span><span class="no">${b.no}</span>`;
    it.onclick = ()=>{ focusSpot(el); openDetail(b, el); };
    list.appendChild(it);
  });
  document.getElementById('s-booth').textContent = D.booths.length;
  document.getElementById('s-zone').textContent = new Set(D.booths.map(b=>b.zone)).size;
  document.getElementById('s-note').textContent = D.booths.reduce((a,b)=>a+(b.sources||[]).length,0);
  document.getElementById('s-rev').textContent = D.booths.filter(b=>b.reviews).length;
}
document.getElementById('q').addEventListener('input', renderList);
document.querySelectorAll('#zchips .chip').forEach(c=>{
  c.onclick = ()=>{
    document.querySelectorAll('#zchips .chip').forEach(o=>o.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true');
    renderList();
  };
});

/* ---------- 人气榜 ---------- */
function renderHeat(){
  const rows = document.getElementById('heat-rows');
  const sub = document.getElementById('heat-sub');
  const scored = spots
    .map(({b, el})=>({b, el, heat: (b.reviews && b.reviews.heat) || 0}))
    .filter(x=> x.heat > 0)
    .sort((x,y)=> y.heat - x.heat);
  rows.innerHTML = '';
  if (!scored.length){
    sub.textContent = '按小红书讨论量统计';
    rows.innerHTML = `<div class="hempty">暂无数据。需要登录态下采集小红书笔记与评论后生成。</div>`;
    return;
  }
  const max = scored[0].heat || 1;
  sub.textContent = `口径：相关笔记×2 + 用户评论×1 + 笔记点赞×0.2　·　已收录 ${scored.length} 个展位`;
  scored.forEach((x, i)=>{
    const r = document.createElement('div');
    r.className = 'hrow';
    r.dataset.z = x.b.zone;
    r.innerHTML = `<span class="hr">${i+1}</span>
      <span class="hn">${esc(x.b.ip)}</span>
      <span class="htrack"><i class="hfill" style="width:${Math.max(4, x.heat/max*100)}%"></i></span>
      <span class="hv">${x.heat}</span>`;
    r.onclick = ()=>{ focusSpot(x.el); openDetail(x.b, x.el); };
    rows.appendChild(r);
  });
}

/* ---------- 详情页 ---------- */
const veil = document.getElementById('veil');
const detail = document.getElementById('detail');
let current = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openDetail(b, el){
  current = b;
  spots.forEach(s=> s.el.classList.toggle('on', s.b.id===b.id));

  document.getElementById('d-badge').textContent = b.no;
  document.getElementById('d-badge').dataset.z = b.zone;
  document.getElementById('d-title').textContent = b.ip;
  document.getElementById('d-sub').innerHTML =
    `${esc(b.zone)} 区 · ${esc(zoneName[b.zone]||'')} ｜ 展位 ${esc(b.no)} ｜ 出展商：<b>${esc(b.exhibitor)}</b>`;

  document.getElementById('d-body').innerHTML = renderBody(b);

  // 图廊点击 → 灯箱
  const ph = b.photos || [];
  document.querySelectorAll('#d-body .gallery .gitem').forEach(el=>{
    el.onclick = ()=>{
      const p = ph[+el.dataset.i];
      if (!p) return;
      const cap = [
        esc(p.caption || '展台实拍'),
        p.author ? '摄影 @' + esc(p.author) : '',
        p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">原帖 ↗</a>` : ''
      ].filter(Boolean).join('　·　');
      openLbox(p.src, cap);
    };
  });

  veil.classList.add('on');
  detail.classList.add('on');
  detail.classList.remove('anim');

  // FLIP：从热区位置放大展开到屏幕居中
  const W = detail.offsetWidth, H = detail.offsetHeight;
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const from = el.getBoundingClientRect();
  const sx = Math.max(0.05, from.width / W);
  const sy = Math.max(0.05, from.height / H);
  detail.style.transformOrigin = '0 0';
  detail.style.transition = 'none';
  detail.style.transform =
    `translate(${from.left - cx}px, ${from.top - cy}px) scale(${sx}, ${sy})`;
  detail.style.opacity = '0.35';
  requestAnimationFrame(()=>{
    detail.style.transition = '';
    detail.classList.add('anim');
    detail.style.transform = `translate(${-W/2}px, ${-H/2}px) scale(1,1)`;
    detail.style.opacity = '1';
  });
  document.getElementById('d-body').scrollTop = 0;
}

function closeDetail(){
  detail.classList.remove('on','anim');
  detail.style.transform = 'translate(-50%,-50%)';
  veil.classList.remove('on');
  spots.forEach(s=> s.el.classList.remove('on'));
  current = null;
  renderList();
}
document.getElementById('xbtn').onclick = closeDetail;
veil.onclick = closeDetail;
document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape') return;
  if (lbox.classList.contains('on')){ closeLbox(); return; }
  if (current) closeDetail();
});

/* ---------- 图片灯箱 ---------- */
const lbox = document.getElementById('lbox');
function openLbox(src, cap){
  document.getElementById('lbox-img').src = src;
  document.getElementById('lbox-cap').innerHTML = cap || '';
  lbox.classList.add('on');
}
function closeLbox(){ lbox.classList.remove('on'); document.getElementById('lbox-img').src = ''; }
document.getElementById('lbox-x').onclick = closeLbox;
lbox.onclick = e=>{ if (e.target === lbox) closeLbox(); };

function renderBody(b){
  let h = '';

  /* ⓪ 头部：用户实拍图廊 */
  const photos = b.photos || [];
  h += `<div class="gallery">`;
  h += `<div class="gtop"><h3>展台实拍</h3><span class="gcount">${
    photos.length ? photos.length + ' 张 · 点开看大图' : '待采集'}</span></div>`;
  if (photos.length){
    h += `<div class="gstrip">`;
    photos.forEach((p, i)=>{
      const cap = [p.author ? '@' + p.author : '', p.caption || ''].filter(Boolean).join('　');
      h += `<div class="gitem" data-i="${i}">
        <img src="${esc(p.src)}" alt="${esc(p.caption || '展台实拍')}" loading="lazy">
        <span class="gcap">${esc(cap)}</span>
      </div>`;
    });
    h += `</div>`;
    h += `<div class="gnote">照片来自到访观众在小红书发布的笔记，版权归原作者；点击可看大图与出处。</div>`;
  } else {
    h += `<div class="gempty">
      该展位暂未采到符合「观众实拍」要求的照片。<br>
      检索按展位名与 IP 关键词进行，并剔除了官方发布与纯打卡内容。
    </div>`;
  }
  h += `</div>`;

  /* ① 出展商 */
  h += `<div class="sec"><h3>出展商</h3>
    <dl class="kv">
      <dt>出展主体</dt><dd><b>${esc(b.exhibitor)}</b></dd>
      <dt>IP 起源</dt><dd>日本 · ${esc(b.originNote)}</dd>
      <dt>展位位置</dt><dd>${esc(b.zone)} 区（${esc(zoneName[b.zone]||'')}）· ${esc(b.no)}</dd>
      ${b.xhs && b.xhs.name ? `<dt>官方账号</dt><dd>小红书 @${esc(b.xhs.name)}</dd>` : ''}
    </dl>
    ${b.blurb ? `<div class="note">官方一句话：${esc(b.blurb)}</div>` : ''}
    ${b.intro ? `<div class="note"><b>展位概况</b>　${esc(b.intro)}</div>` : ''}
    ${b.shared ? `<div class="note">${esc(b.shared)}</div>` : ''}
  </div>`;

  /* ② 活动 + 照片 */
  const acts = b.activities || [];
  h += `<div class="sec"><h3>展台活动 · 每个活动一张官方图</h3>`;
  if (!acts.length){
    h += `<div class="empty">官方暂未公布该展位的活动明细。</div>`;
  } else {
    h += `<div class="acts">`;
    acts.forEach(a=>{
      const img = a.image ? `<img src="展位图/${esc(a.image.replace('img/booths/',''))}" alt="${esc(a.title)}" loading="lazy">` : `<span class="ph-empty">暂无配图</span>`;
      h += `<div class="act">
        <div class="ph">${img}</div>
        <div class="tx">
          <h4>${esc(a.title)}</h4>
          ${a.desc ? `<p>${esc(a.desc)}</p>` : ''}
          ${a.caption ? `<div class="cap"><b>图注</b>　${esc(a.caption)}</div>` : ''}
        </div>
      </div>`;
    });
    h += `</div>`;
  }
  if ((b.rewards||[]).length){
    h += `<div class="rwd"><b>现场可领</b><ul>`;
    b.rewards.forEach(r=>{
      if (typeof r === 'string'){ h += `<li><span class="rn">${esc(r)}</span></li>`; return; }
      h += `<li><span class="rn">${esc(r.name||'')}</span>${r.how?`<span class="rh">${esc(r.how)}</span>`:''}</li>`;
    });
    h += `</ul></div>`;
  }
  h += `</div>`;

  /* ③ 用户体验 */
  h += `<div class="sec"><h3>用户体验总结</h3>`;
  if (!b.reviews){
    const nSrc = (b.sources||[]).length;
    const nAct = (b.activities||[]).length;
    h += `<div class="empty">
      <b>该展位的用户评价暂未采到。</b><br>
      小红书正文与评论不对搜索引擎开放，只能登录态下站内检索。
      按展位名与 IP 关键词检索，剔除官方发布与纯打卡帖后，仍无足够有效发言。<br>
      <span style="color:var(--ink3)">已知：官方笔记 ${nSrc} 篇 · 公布活动 ${nAct} 项（见上方两节）</span>
    </div>`;
  } else {
    const r = b.reviews;
    /* 只有两个数字：人气排名 + 用户评论数。其余统计卡片与情绪条已下线。 */
    h += `<div class="rmeta">`;
    if (r.heatRank){
      h += `<span class="rankchip${r.heatRank.rank<=3?' top3':''}">人气第 ${r.heatRank.rank} / ${r.heatRank.total}</span>`;
    }
    if (r.commentCount != null){
      h += `<span class="cstat"><b>${esc(r.commentCount)}</b> 条用户评论</span>`;
    }
    h += `</div>`;
    if (r.summary) h += `<div class="sub"><h4>舆情综述</h4><p>${esc(r.summary)}</p></div>`;
    if ((r.points||[]).length){
      h += `<div class="sub"><h4>分主题用户感想</h4><div class="points">`;
      r.points.forEach(p=>{
        h += `<div class="pt"><span class="tag ${esc(p.sentiment||'neu')}">${esc(p.label)}</span><span>${esc(p.text)}</span></div>`;
      });
      h += `</div></div>`;
    }
    if ((r.quotes||[]).length){
      h += `<div class="sub"><h4>代表性原帖</h4><div class="quotes">`;
      r.quotes.forEach(q=>{
        h += `<div class="quote">${esc(q.text)}
          <div class="meta">${esc(q.author)}${q.date?' · '+esc(q.date):''}${q.likes?' · '+esc(q.likes)+' 赞':''}
          ${q.url?` · <a href="${esc(q.url)}" target="_blank" rel="noopener">原帖</a>`:''}</div>
        </div>`;
      });
      h += `</div></div>`;
    }
    if (r.method) h += `<div class="note">统计口径：${esc(r.method)}</div>`;
  }
  h += `</div>`;

  /* 来源 */
  if ((b.sources||[]).length){
    h += `<div class="sec"><h3>官方笔记来源</h3><div class="srcs">`;
    b.sources.slice(0,10).forEach(s=>{
      h += `<div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.noteId)}</a>
        <span class="d">@${esc(s.author)}${s.date?' · '+esc(s.date):''}</span></div>`;
    });
    h += `</div></div>`;
  }
  return h;
}

/* ---------- 启动 ---------- */
fit();
renderList();
renderHeat();
window.addEventListener('resize', ()=>{
  fit();
  if (current){
    const W = detail.offsetWidth, H = detail.offsetHeight;
    detail.style.transform = `translate(${-W/2}px, ${-H/2}px) scale(1,1)`;
  }
});
</script>
</body>
</html>
